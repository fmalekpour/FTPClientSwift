name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, private keys, tokens, customer data, or sensitive server logs.
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and toolchain
    validations:
      required: true
  - type: textarea
    id: server
    attributes:
      label: Server and connection mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal code sample and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove secrets and sensitive paths before posting.
