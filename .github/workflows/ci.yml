name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check toolchain and integration prerequisites
        run: |
          swift --version
          swift package dump-package > /dev/null
          test -x /opt/homebrew/bin/node || test -x /usr/local/bin/node || test -x /usr/bin/node
          test -x /opt/homebrew/bin/openssl || test -x /usr/local/bin/openssl || test -x /usr/bin/openssl
      - name: Run tests
        # TLS fixtures generate certificates and launch local servers. Running
        # all fixtures concurrently can starve short timeout tests on CI runners.
        run: swift test --no-parallel
      - name: Build release
        run: swift build -c release
